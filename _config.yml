title: Rushikesh Mohalkar
tagline: AI/ML Engineer & Software Developer
description: >-
  Portfolio of Rushikesh Mohalkar — AI/ML engineer specializing in deep learning,
  reinforcement learning, computer vision, and generative AI.
author: Rushikesh Mohalkar
email: rushikeshmohalkar2001@gmail.com
lang: en

# Update these two if the repo/domain changes.
url: "https://rushikesh-cts.github.io"
baseurl: ""

# Clean, grouped blog URLs: /blogs/my-post-title/
permalink: /blogs/:title/

social:
  github: mohalkarushikesh
  linkedin: rushikesh-mohalkar
  x: mohalkrushikesh

# GitHub Pages–supported plugins (build server-side → static HTML, zero client JS on the home page).
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Default social-share image for jekyll-seo-tag (og:image + twitter:card).
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og.png
  # Every post defaults to the shared post layout.
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Rushikesh Mohalkar

# Keep build output lean and don't publish source docs / office files.
exclude:
  - deployment.md
  - Instructions.md
  - project_structure.md
  - PREVIEW.md
  - Readme.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - preview_build.py
  - "resume/*.docx"

sass:
  style: compressed
